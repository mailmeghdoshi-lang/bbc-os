async function hashPwd(pwd){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pwd));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// ─── AUTO PROGRESS ────────────────────────────────────────────────
function recalc(pid){
  const p=S.projects.find(p=>p.id===pid);if(!p)return;
  const all=S.tasks.filter(t=>t.projectId===pid);
  const done=all.filter(t=>t.done).length;
  p.progress=all.length===0?0:Math.round((done/all.length)*100);
  p.status=p.progress===100?'completed':(p.status==='completed'?'active':p.status);
  save();
}

  S.activity.unshift({id:uid(),type,text,icon,time:new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}),ts:Date.now()});
  if(S.activity.length>200)S.activity.length=200;save();
}

// ─── ALERTS ──────────────────────────────────────────────────────
function getAlerts(uid){
  const a=[];
  // Only open (not done) tasks
  S.tasks.filter(t=>!t.done&&(uid==='OWNER'||t.assignee===uid)).forEach(t=>{
    const d=daysDiff(t.dueDate);
    if(d<0)  a.push({type:'overdue',item:'Task',   name:t.title,detail:`${Math.abs(d)}d overdue`,assignee:t.assignee,days:d});
    else if(d<=3)a.push({type:'soon',item:'Task',   name:t.title,detail:`Due in ${d===0?'today':d+'d'}`,assignee:t.assignee,days:d});
  });
  // Only active (not completed/done) projects
  S.projects.filter(p=>p.status==='active'&&p.progress<100&&(uid==='OWNER'||(p.team||[]).includes(uid))).forEach(p=>{
    const d=daysDiff(p.dueDate);
    if(d<0)  a.push({type:'overdue',item:'Project',name:p.name,detail:`${Math.abs(d)}d overdue`,days:d});
    else if(d<=7)a.push({type:'soon',item:'Project',name:p.name,detail:`Due in ${d===0?'today':d+'d'}`,days:d});
  });
  if(uid==='OWNER')S.invoices.filter(i=>i.status!=='paid'&&i.status!=='draft').forEach(i=>{
    const d=daysDiff(i.dueDate);
    if(d<0)  a.push({type:'overdue',item:'Invoice',name:i.id,detail:`${fmtINR(i.amount)} ${Math.abs(d)}d overdue`,days:d});
    else if(d<=5)a.push({type:'soon',item:'Invoice',name:i.id,detail:`${fmtINR(i.amount)} due in ${d===0?'today':d+'d'}`,days:d});
  });
  return a.sort((a,b)=>a.days-b.days);
}
function getFUAlerts(){
  // ADMIN ONLY — team members never see lead follow-up alerts
  if(!isAdmin()) return [];
  const now=new Date();
  return S.leads.filter(l=>{
    if(!l.followupAt||l.followupDone||['Onboarded','Lost','Rejected'].includes(l.stage))return false;
    const diff=Math.round((new Date(l.followupAt)-now)/60000);
    return diff>=-30&&diff<=1440;
  }).sort((a,b)=>new Date(a.followupAt)-new Date(b.followupAt));
}

  const pass=document.getElementById('li-pass').value;

  const btn=document.getElementById('li-btn');

  if(!email||!pass){err.textContent='Enter your email and password.';err.style.display='block';return;}
  btn.textContent='Signing in…';btn.disabled=true;
  // Check admin
  if(email===S.adminEmail.toLowerCase()){
    if(await checkPwd(pass,S.adminPwdHash)){
      S.currentUser='OWNER';S.page='dashboard';render();return;
    }
  }
  // Check team members
  const member=S.team.find(m=>(m.email||'').toLowerCase()===email);
  if(member&&member.pwdHash&&await checkPwd(pass,member.pwdHash)){
    S.currentUser=member.id;S.page='dashboard';render();return;

  btn.textContent='Sign In';btn.disabled=false;
}

  const m=curM();if(!m)return;
  if(!memberPerms(m)[pg]){toast('⚠ You don\'t have access to this module');return;}
  S.page=pg;
  // update active nav
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.getAttribute('onclick')===`memberNavigate('${pg}')`));

  renderMemberPage();
}
function renderMemberPage(){
  const c=document.getElementById('content');if(!c)return;
  const m=curM();if(!m)return;
  // Hard block: members can NEVER see services regardless of URL manipulation
  if(S.page==='services'){S.page='dashboard';}
  switch(S.page){
    case 'dashboard':   renderMemberContent();break;
    case 'tasks':       c.innerHTML=memberTasksHTML();break;
    case 'projects':    c.innerHTML=memberProjectsHTML();break;
    case 'clients':     c.innerHTML=memberClientsHTML();break;
    case 'invoices':    c.innerHTML=memberInvoicesHTML();break;
    case 'leads':       c.innerHTML=memberLeadsHTML();break;
    case 'quotations':  c.innerHTML=memberQuotationsHTML();break;
    case 'calendar':    renderCalendar(c,{innerHTML:''});break;
    case 'activity':    renderActivity(c,{innerHTML:''});break;
    case 'alerts':      renderAlerts(c,m.id);break;
    default:            renderMemberContent();
  }
}

function renderCalendar(c,a){
  a.innerHTML=`<button class="btn" onclick="calPrev()">← Prev</button><button class="btn" onclick="calNext()">Next →</button><button class="btn btn-primary" onclick="openAddCalEvent()">+ Add Event</button>`;
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const y=S.calYear,m=S.calMonth;
  const fd=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),dip=new Date(y,m,0).getDate();
  const evMap={};
  function addEv(date,ev){const d=new Date(date);const k=`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;if(!evMap[k])evMap[k]=[];evMap[k].push(ev);}
  S.tasks.filter(t=>!t.done).forEach(t=>{const d=daysDiff(t.dueDate);addEv(t.dueDate,{label:`[T] ${t.title.substring(0,14)}`,cls:d<0?'cal-event-overdue':'cal-event-task'});});
  S.projects.filter(p=>p.status==='active').forEach(p=>{const d=daysDiff(p.dueDate);addEv(p.dueDate,{label:`[P] ${p.name.substring(0,14)}`,cls:d<0?'cal-event-overdue':'cal-event-project'});});
  S.invoices.filter(i=>i.status!=='paid'&&i.status!=='draft').forEach(i=>{addEv(i.dueDate,{label:`[I] ${i.id}`,cls:'cal-event-invoice'});});
  S.calEvents.forEach(e=>addEv(e.date,{label:e.title,cls:'cal-event-custom',id:e.id}));
  S.leads.filter(l=>l.followupAt).forEach(l=>{addEv(new Date(l.followupAt),{label:`[F] ${l.title.substring(0,13)}`,cls:'cal-event-lead'});});
  let cells='';let dc=1;
  for(let i=0;i<42;i++){
    let cd,ot=false;
    if(i<fd){cd=new Date(y,m-1,dip-fd+1+i);ot=true;}
    else if(dc<=dim){cd=new Date(y,m,dc++);}
    else{cd=new Date(y,m+1,dc++-dim);ot=true;}
    const iT=cd.toDateString()===TODAY.toDateString();
    const k=`${cd.getFullYear()}-${cd.getMonth()}-${cd.getDate()}`;
    const evs=evMap[k]||[];const iso=cd.toISOString().split('T')[0];
    cells+=`<div class="cal-cell ${ot?'other-month':''} ${iT?'today':''}" onclick="calCellClick('${iso}')">
      <div class="cal-date">${iT?`<span style="background:#1a1a1a;color:#fff;border-radius:50%;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-size:10px">${cd.getDate()}</span>`:cd.getDate()}</div>
      ${evs.slice(0,3).map(ev=>`<div class="cal-event ${ev.cls}" ${ev.id?`onclick="event.stopPropagation();deleteCalEvent('${ev.id}')" title="Click to delete"`:''}>${ev.label}</div>`).join('')}
      ${evs.length>3?`<div style="font-size:9px;color:#aaa;padding:1px 5px">+${evs.length-3} more</div>`:''}
      <div class="cal-add-hint">+ add</div>
    </div>`;
  }
  c.innerHTML=`<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px">
    <span style="font-size:14px;font-weight:600">${months[m]} ${y}</span>
    <div style="display:flex;gap:8px;font-size:11px;align-items:center;flex-wrap:wrap">
      ${[['cal-event-task','Tasks'],['cal-event-project','Projects'],['cal-event-invoice','Invoices'],['cal-event-lead','Follow-ups'],['cal-event-custom','Custom'],['cal-event-overdue','Overdue']].map(([cls,lbl])=>`<span style="display:flex;align-items:center;gap:3px"><span class="${cls}" style="width:10px;height:10px;display:inline-block;border-radius:2px"></span>${lbl}</span>`).join('')}
    </div>
  </div>
  <div class="cal-grid">${days.map(d=>`<div class="cal-day-label">${d}</div>`).join('')}${cells}</div>
  <div style="margin-top:.75rem;font-size:10px;color:#aaa;text-align:center">Click date to add event · Click purple custom event to delete</div></div>`;
}
function calPrev(){if(S.calMonth===0){S.calMonth=11;S.calYear--;}else S.calMonth--;renderPage();}
function calNext(){if(S.calMonth===11){S.calMonth=0;S.calYear++;}else S.calMonth++;renderPage();}
function calCellClick(iso){openAddCalEvent(iso);}
function openAddCalEvent(p){showModal(`<div class="modal-title">Add Calendar Event</div>
  <div class="form-group"><label class="form-label">Title *</label><input class="form-input" id="ev-t" placeholder="e.g. Client call"></div>
  <div class="form-group"><label class="form-label">Date</label><input class="form-input" id="ev-d" type="date" value="${p||''}"></div>
  <div class="form-group"><label class="form-label">Note</label><input class="form-input" id="ev-n" placeholder="Details..."></div>
  <div class="modal-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveCalEvent()">Add</button></div>`);}
function saveCalEvent(){
  const t=document.getElementById('ev-t').value.trim();const d=document.getElementById('ev-d').value;
  if(!t||!d){alert('Title and date required.');return;}
  S.calEvents.push({id:uid(),title:t,date:new Date(d),note:document.getElementById('ev-n').value.trim()});
  save();log('comment',`Calendar event "<span class="activity-tag">${esc(t)}</span>" added`,'📅');closeModal();renderPage();
}
function deleteCalEvent(id){const i=S.calEvents.findIndex(e=>e.id===id);if(i>-1){S.calEvents.splice(i,1);save();renderPage();}}

  _qrc=0;

  const initRows=initSvcs.length?initSvcs.map(sn=>{const sv=allServices().find(s=>s.name===sn);return qRow(_qrc++,sn,sv?sv.price:0,0);}).join(''):qRow(_qrc++,'',0,0);

    <div class="form-group"><label class="form-label">Linked Lead</label><select class="form-input" id="q-lead" onchange="prefillLead()"><option value="">— No lead linked —</option>${lo}</select></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">

    <!-- LINE ITEMS with per-row discount -->
    <div style="margin-bottom:8px">
      <div class="qi-header">
        <span class="qi-label">Service</span>
        <span class="qi-label">Rate (₹)</span>
        <span class="qi-label">Qty</span>
        <span class="qi-label">Disc %</span>
        <span class="qi-label">Net (₹)</span>
        <span></span>
      </div>
      <div id="q-items">${initRows}</div>
    </div>
    <button class="btn btn-sm" onclick="addQRow()" style="margin-bottom:1rem">+ Add Line</button>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div class="form-group"><label class="form-label">GST % (applied on net after discounts)</label><input class="form-input" id="q-gst" type="number" value="18" oninput="calcTotal()"></div>
      <div></div>
    </div>
    <div style="background:#f4f3f0;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:.875rem" id="q-total-box">Subtotal: ₹0</div>
    <div class="form-group"><label class="form-label">Additional Terms / Notes</label><textarea class="form-input" id="q-addnotes" placeholder="e.g. Revisions included, content to be provided by client..."></textarea></div>
    <div class="modal-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveQuote()">Save Quotation</button></div>`);
  setTimeout(calcTotal,100);

function qRow(i,svcName,rate,disc){
  const opts=allServices().map(s=>`<option value="${esc(s.name)}" data-price="${s.price}" ${s.name===svcName?'selected':''}>${esc(s.name)} (${fmtINR(s.price)})</option>`).join('');
  return `<div class="qi-row" id="qrow-${i}">
    <select class="form-input" id="qsvc-${i}" onchange="onSvcChange(${i})" style="font-size:11px">
      <option value="">— Select service —</option>${opts}
    </select>
    <input class="form-input" id="qrate-${i}" type="number" placeholder="Rate ₹" value="${rate||''}" oninput="calcTotal()" style="font-size:12px">
    <input class="form-input" id="qqty-${i}" type="number" placeholder="Qty" value="1" min="1" oninput="calcTotal()" style="font-size:12px">
    <input class="form-input" id="qdisc-${i}" type="number" placeholder="0%" value="${disc||0}" min="0" max="100" oninput="calcTotal()" style="font-size:12px;background:${disc>0?'#FEF9C3':''}">
    <input class="form-input" id="qnet-${i}" type="number" placeholder="Net ₹" readonly style="font-size:12px;background:#f4f3f0;color:#1a1a1a">
    <button class="btn btn-danger btn-sm" onclick="removeQRow(${i})" style="padding:4px 6px">✕</button>
  </div>`;
}
function onSvcChange(i){
  const sel=document.getElementById('qsvc-'+i);if(!sel)return;
  const opt=sel.options[sel.selectedIndex];
  const price=opt?opt.getAttribute('data-price'):0;
  const ri=document.getElementById('qrate-'+i);if(ri)ri.value=price||'';
  calcTotal();
}
function addQRow(){const c=document.getElementById('q-items');if(!c)return;const d=document.createElement('div');d.innerHTML=qRow(_qrc,'',0,0);c.appendChild(d.firstElementChild);_qrc++;calcTotal();}
function removeQRow(i){const el=document.getElementById('qrow-'+i);if(el)el.remove();calcTotal();}
function calcTotal(){
  let subtotal=0,totalDisc=0;
  for(let i=0;i<_qrc+2;i++){
    const sv=document.getElementById('qsvc-'+i);const ra=document.getElementById('qrate-'+i);
    const qt=document.getElementById('qqty-'+i);const dc=document.getElementById('qdisc-'+i);const nt=document.getElementById('qnet-'+i);
    if(!ra)continue;
    const rate=Number(ra.value)||0;const qty=Number(qt?.value)||1;const disc=Number(dc?.value)||0;
    const gross=rate*qty;const discAmt=gross*disc/100;const net=gross-discAmt;
    if(nt)nt.value=Math.round(net)||'';
    // highlight discount cell
    if(dc){dc.style.background=disc>0?'#FEF9C3':'';}
    subtotal+=gross;totalDisc+=discAmt;
  }
  const netTotal=subtotal-totalDisc;
  const gst=Number(document.getElementById('q-gst')?.value)||0;
  const gstAmt=netTotal*gst/100;const grandTotal=netTotal+gstAmt;
  const tb=document.getElementById('q-total-box');
  if(tb)tb.innerHTML=`<div style="display:flex;gap:1.5rem;flex-wrap:wrap;align-items:center">
    <span>Subtotal: <strong>${fmtINR(Math.round(subtotal))}</strong></span>
    ${totalDisc>0?`<span style="color:#639922">Discount: <strong>−${fmtINR(Math.round(totalDisc))}</strong></span>`:''}
    <span>Net: <strong>${fmtINR(Math.round(netTotal))}</strong></span>
    <span>GST (${gst}%): <strong>${fmtINR(Math.round(gstAmt))}</strong></span>
    <span style="font-size:16px;font-weight:700">Total: ${fmtINR(Math.round(grandTotal))}</span>
  </div>`;
}
function prefillLead(){
  const sel=document.getElementById('q-lead');if(!sel)return;
  const l=S.leads.find(l=>l.id===sel.value);if(!l)return;
  const ci=document.getElementById('q-client');if(ci)ci.value=l.company||l.title;
  const ct=document.getElementById('q-contact');if(ct)ct.value=l.contact||'';
  const em=document.getElementById('q-email');if(em)em.value=l.email||'';
  const ph=document.getElementById('q-phone');if(ph)ph.value=l.phone||'';
}
function getQItems(){
  const items=[];
  for(let i=0;i<_qrc+2;i++){
    const sv=document.getElementById('qsvc-'+i);const ra=document.getElementById('qrate-'+i);
    const qt=document.getElementById('qqty-'+i);const dc=document.getElementById('qdisc-'+i);const nt=document.getElementById('qnet-'+i);
    if(!sv||!ra)continue;
    const svc=sv.value;const rate=Number(ra.value)||0;
    if(!svc&&!rate)continue;
    const qty=Number(qt?.value)||1;const discPct=Number(dc?.value)||0;
    const gross=rate*qty;const discAmt=gross*discPct/100;const net=gross-discAmt;
    items.push({service:svc||'Custom',rate,qty,discPct,discAmt:Math.round(discAmt),gross:Math.round(gross),net:Math.round(net)});
  }
  return items;
}
function saveQuote(){
  const client=document.getElementById('q-client')?.value.trim();if(!client){alert('Client name required.');return;}
  const leadId=document.getElementById('q-lead')?.value||'';
  const lead=S.leads.find(l=>l.id===leadId);
  const items=getQItems();if(!items.length){alert('Add at least one service line.');return;}
  const subtotal=items.reduce((s,it)=>s+it.gross,0);
  const totalDisc=items.reduce((s,it)=>s+it.discAmt,0);
  const netTotal=subtotal-totalDisc;
  const gstPct=Number(document.getElementById('q-gst')?.value)||0;
  const gstAmt=Math.round(netTotal*gstPct/100);
  const total=Math.round(netTotal+gstAmt);
  const qNo='QT-'+String(S.quotations.length+1).padStart(3,'0');
  const q={id:uid(),quoteNo:qNo,leadId,leadTitle:lead?lead.title:'',clientName:client,
    contactName:document.getElementById('q-contact')?.value.trim()||'',
    email:document.getElementById('q-email')?.value.trim()||'',
    phone:document.getElementById('q-phone')?.value.trim()||'',
    validUntil:document.getElementById('q-valid')?.value||'',
    terms:document.getElementById('q-terms')?.value.trim()||'',
    scope:document.getElementById('q-scope')?.value.trim()||'',
    addNotes:document.getElementById('q-addnotes')?.value.trim()||'',
    items,subtotal,totalDiscount:totalDisc,netTotal,gstPct,gstAmt,total,
    status:'draft',createdAt:new Date().toISOString()};
  S.quotations.push(q);
  if(lead){if(!lead.quotations)lead.quotations=[];lead.quotations.push(q.id);if(total>0&&!lead.value)lead.value=total;}
  save();log('lead',`Quotation <span class="activity-tag">${qNo}</span> created for <span class="activity-tag">${esc(client)}</span>`,'📄');
  closeModal();S.page='quotations';renderPage();
}

  const cid=document.getElementById('m-pclient').value;const dr=document.getElementById('m-pdue').value;
  const cl=S.clients.find(c=>c.id===cid);const pid=uid();
  const proj={id:pid,name,client:cl.name,clientId:cid,status:document.getElementById('m-pstatus').value,
    progress:0,dueDate:dr?new Date(dr):new Date(TODAY.getTime()+30*86400000),
    team:['YO'],color:['dot-green','dot-blue','dot-amber','dot-gray'][S.projects.length%4]};
  S.projects.push(proj);cl.projects=(cl.projects||0)+1;
  const t1due=document.getElementById('m-t1due').value;const t1ass=document.getElementById('m-t1assignee').value;
  S.tasks.push({id:uid(),title:t1,project:name,projectId:pid,assignee:t1ass,priority:document.getElementById('m-t1priority').value,notes:document.getElementById('m-t1notes').value.trim(),done:false,dueDate:t1due?new Date(t1due):new Date(TODAY.getTime()+7*86400000)});
  if(!proj.team.includes(t1ass))proj.team.push(t1ass);
  (window._extraProjTasks||[]).forEach(i=>{
    const el=document.getElementById(`ptask-${i}`);if(!el)return;
    const tt=document.getElementById(`pt${i}-title`)?.value.trim();if(!tt)return;
    const tdue=document.getElementById(`pt${i}-due`)?.value;const tass=document.getElementById(`pt${i}-assignee`)?.value||'YO';
    S.tasks.push({id:uid(),title:tt,project:name,projectId:pid,assignee:tass,priority:document.getElementById(`pt${i}-priority`)?.value||'medium',notes:'',done:false,dueDate:tdue?new Date(tdue):new Date(TODAY.getTime()+7*86400000)});
    if(!proj.team.includes(tass))proj.team.push(tass);
  });
  window._extraProjTasks=[];recalc(pid);
  save();log('project',`Project <span class="activity-tag">${esc(name)}</span> created with tasks`,'＋');closeModal();renderPage();
}

function openEditTask(id){
  const t=S.tasks.find(t=>t.id===id);if(!t)return;
  const po=S.projects.map(p=>`<option value="${p.id}" ${p.id===t.projectId?'selected':''}>${esc(p.name)}</option>`).join('');
  const to=S.team.map(m=>`<option value="${m.id}" ${m.id===t.assignee?'selected':''}>${esc(m.name)}</option>`).join('');
  showModal(`<div class="modal-title">Edit Task</div>
    <div class="form-group"><label class="form-label">Title *</label><input class="form-input" id="m-ttitle" value="${esc(t.title)}"></div>
    <div class="form-group"><label class="form-label">Project</label><select class="form-input" id="m-tproject">${po}</select></div>
    <div class="form-group"><label class="form-label">Assign To</label><select class="form-input" id="m-tassignee"><option value="YO" ${t.assignee==='YO'?'selected':''}>${esc(S.ownerName)}</option>${to}</select></div>

    <div class="modal-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="updateTask('${id}')">Save</button></div>`);}
function updateTask(id){
  const t=S.tasks.find(t=>t.id===id);if(!t)return;
  t.title=document.getElementById('m-ttitle').value.trim()||t.title;
  t.projectId=document.getElementById('m-tproject').value;t.assignee=document.getElementById('m-tassignee').value;
  t.priority=document.getElementById('m-tpriority').value;t.notes=document.getElementById('m-tnotes').value.trim();
  const dr=document.getElementById('m-tdue').value;if(dr)t.dueDate=new Date(dr);
  const pr=S.projects.find(p=>p.id===t.projectId);if(pr)t.project=pr.name;
  save();closeModal();renderPage();}
function openAssignTask(mid){
  if(!S.projects.length){alert('Please add a project first.');return;}
  const po=S.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');

function saveTask(){
  const title=document.getElementById('m-ttitle').value.trim();if(!title){alert('Title required.');return;}
  const pid=document.getElementById('m-tproject').value;const ass=document.getElementById('m-tassignee').value;
  const dr=document.getElementById('m-tdue').value;const pri=document.getElementById('m-tpriority').value;
  const notes=document.getElementById('m-tnotes')?.value.trim()||'';
  const pr=S.projects.find(p=>p.id===pid);const id=uid();
  S.tasks.push({id,title,project:pr.name,projectId:pid,assignee:ass,priority:pri,notes,done:false,dueDate:dr?new Date(dr):new Date(TODAY.getTime()+7*86400000)});
  if(!(pr.team||[]).includes(ass)){pr.team=[...(pr.team||['YO']),ass];}
  recalc(pid);log('task',`<span class="activity-tag">${nMap[ass]||ass}</span> assigned "<span class="activity-tag">${esc(title)}</span>"`,'→');closeModal();renderPage();}

  cl.contact = document.getElementById('m-ccontact').value.trim()||'—';
  cl.email   = document.getElementById('m-cemail').value.trim()||'—';
  cl.phone   = document.getElementById('m-cphone').value.trim()||'—';
  cl.revenue = Number(document.getElementById('m-crev').value)||0;

function deleteClient(id){
  const cl=S.clients.find(c=>c.id===id);if(!cl)return;
  const linked=S.projects.filter(p=>p.clientId===id).length;
  if(linked>0){
    if(!confirm(`"${cl.name}" has ${linked} project${linked!==1?'s':''} linked to it.\n\nDeleting the client will not delete those projects — they will remain but lose their client link.\n\nProceed?`))return;
  } else {
    if(!confirm(`Delete "${cl.name}"? This cannot be undone.`))return;
  }
  const i=S.clients.findIndex(c=>c.id===id);
  if(i>-1){S.clients.splice(i,1);}
  save();log('client',`Client <span class="activity-tag">${esc(cl.name)}</span> deleted`,'✕');renderPage();
}

async function saveMember(){
  const name=document.getElementById('m-mname').value.trim();if(!name){alert('Name required.');return;}
  const email=document.getElementById('m-memail').value.trim().toLowerCase();if(!email){alert('Email required.');return;}
  const p1=document.getElementById('m-mpwd').value;const p2=document.getElementById('m-mpwd2').value;
  if(!p1||p1.length<6){alert('Password must be at least 6 characters.');return;}
  if(p1!==p2){alert('Passwords do not match.');return;}
  if(S.team.find(m=>(m.email||'').toLowerCase()===email)||(email===S.adminEmail.toLowerCase())){alert('This email is already in use.');return;}
  const role=document.getElementById('m-mrole').value.trim()||'Team Member';
  const id=(document.getElementById('m-mid').value.trim().toUpperCase()||mkInit(name)).substring(0,3);
  const perms={};Object.keys(MODULES).forEach(k=>{const el=document.getElementById('np-'+k);perms[k]=el?el.checked:DEFAULT_PERMS[k];});
  const pwdHash=await hashPwd(p1);
  S.team.push({id,name,email,role,av:avC(S.team.length),perms,pwdHash});
  rebuildMaps();save();
  log('client',`Team member <span class="activity-tag">${esc(name)}</span> added`,'＋');closeModal();renderPage();
}
