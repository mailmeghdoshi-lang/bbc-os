/* ================================================================
   BBC AGENCY OS — styles.css
   Edit only this file for visual/layout changes
   ================================================================ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --purple: #7c3aed;
  --pink:   #ec4899;
  --bg:     #F5F4F1;
  --white:  #fff;
  --border: rgba(0,0,0,.1);
  --text:   #1a1a1a;
  --muted:  #888;
  --radius: 8px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 13px;
}

@keyframes pulse   { 0%,100%{ opacity:.25; transform:scale(.7) } 50%{ opacity:1; transform:scale(1) } }
@keyframes fadein  { from{ opacity:0; transform:translateY(4px) } to{ opacity:1; transform:translateY(0) } }

/* ── APP SHELL ─────────────────────────────────────────────────── */
.app   { display: flex; height: 100vh; overflow: hidden; }
.main  { flex: 1; overflow-y: auto; display: flex; flex-direction: column; min-width: 0; }
.page  { padding: 1.5rem; flex: 1; animation: fadein .18s ease; }

/* ── SIDEBAR ────────────────────────────────────────────────────── */
.sb {
  width: 220px; min-width: 220px; background: var(--white);
  border-right: .5px solid var(--border);
  display: flex; flex-direction: column; overflow-y: auto;
}
.sb-logo { padding: .875rem 1rem; border-bottom: .5px solid var(--border); }
.sb-logo-name {
  font-size: 13px; font-weight: 800; font-style: italic;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.sb-logo-sub { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-top: 2px; }
.sb-section  { padding: .5rem .5rem 0; }
.sb-lbl      { font-size: 9px; color: #bbb; text-transform: uppercase; letter-spacing: .08em; padding: .5rem .5rem .25rem; font-weight: 600; }
.sb-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; border-radius: var(--radius);
  cursor: pointer; color: #555; user-select: none;
  transition: background .1s; margin-bottom: 1px; position: relative;
}
.sb-item:hover { background: #f4f3f0; color: var(--text); }
.sb-item.on    { background: #f0e6ff; color: var(--purple); font-weight: 500; }
.sb-item svg   { width: 14px; height: 14px; flex-shrink: 0; opacity: .5; }
.sb-item.on svg{ opacity: 1; }
.sb-badge   { background: #c0392b; color: #fff; font-size: 9px; padding: 1px 5px; border-radius: 10px; margin-left: auto; font-weight: 700; }
.sb-badge-p { background: var(--purple); color: #fff; font-size: 9px; padding: 1px 5px; border-radius: 10px; margin-left: auto; font-weight: 700; }
.sb-foot { margin-top: auto; padding: .75rem .5rem; border-top: .5px solid var(--border); }
.sb-user { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: var(--radius); cursor: pointer; }
.sb-user:hover { background: #f4f3f0; }

/* ── TOPBAR ─────────────────────────────────────────────────────── */
.topbar {
  background: var(--white); border-bottom: .5px solid var(--border);
  padding: .875rem 1.5rem; display: flex; align-items: center;
  justify-content: space-between; position: sticky; top: 0; z-index: 20;
}
.topbar-title   { font-size: 15px; font-weight: 600; }
.topbar-actions { display: flex; gap: 8px; align-items: center; }

/* ── BUTTONS ────────────────────────────────────────────────────── */
.btn {
  font-size: 12px; padding: 6px 13px; border-radius: var(--radius);
  border: .5px solid var(--border); background: var(--white);
  color: var(--text); cursor: pointer; font-family: inherit;
  transition: background .1s; white-space: nowrap;
}
.btn:hover         { background: #f4f3f0; }
.btn-primary       { background: var(--text); color: #fff; border-color: var(--text); }
.btn-primary:hover { background: #333; }
.btn-purple        { background: linear-gradient(135deg, var(--purple), var(--pink)); color: #fff; border: none; }
.btn-purple:hover  { opacity: .9; }
.btn-sm            { font-size: 11px; padding: 4px 9px; }
.btn-danger        { background: #fef0f0; color: #c0392b; border-color: #fcc; }
.btn-danger:hover  { background: #fcc; }

/* ── CARDS & LAYOUT ─────────────────────────────────────────────── */
.card { background: var(--white); border: .5px solid var(--border); border-radius: 12px; padding: 1rem 1.25rem; }
.g2   { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.g3   { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
.g4   { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; }

.stat       { background: #f0efe9; border-radius: 10px; padding: 1rem; }
.stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 5px; }
.stat-val   { font-size: 21px; font-weight: 700; }
.stat-sub   { font-size: 11px; color: var(--muted); margin-top: 4px; }

.sh       { display: flex; align-items: center; justify-content: space-between; margin-bottom: .875rem; }
.sh-title { font-size: 13px; font-weight: 600; }

/* ── BADGES ─────────────────────────────────────────────────────── */
.badge   { display: inline-flex; align-items: center; font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 500; white-space: nowrap; }
.b-green  { background: #e8f5e9; color: #2e7d32; }
.b-amber  { background: #fff8e1; color: #f57f17; }
.b-blue   { background: #e3f2fd; color: #1565c0; }
.b-gray   { background: #f1efea; color: #555;    }
.b-red    { background: #fef0f0; color: #c0392b; }
.b-purple { background: #f3e8ff; color: #6d28d9; }
.b-teal   { background: #e0f2f1; color: #00695c; }
.b-pink   { background: #fce4ec; color: #880e4f; }

/* ── AVATARS ────────────────────────────────────────────────────── */
.av    { border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; font-size: 11px; }
.av-a  { background: #d8d5f9; color: #3c3489; }
.av-b  { background: #b2dfdb; color: #004d40; }
.av-c  { background: #ffe0b2; color: #bf360c; }
.av-d  { background: #b3e5fc; color: #01579b; }
.av-e  { background: #f8bbd0; color: #880e4f; }

/* ── TABLES ─────────────────────────────────────────────────────── */
table { width: 100%; border-collapse: collapse; }
th {
  text-align: left; padding: 8px 10px;
  font-size: 11px; font-weight: 600; color: var(--muted);
  border-bottom: .5px solid var(--border); white-space: nowrap;
}
td {
  padding: 9px 10px; font-size: 12px;
  border-bottom: .5px solid rgba(0,0,0,.05); vertical-align: middle;
}
tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: #fafaf9; cursor: pointer; }

/* ── TASK CHECKBOX ──────────────────────────────────────────────── */
.chk {
  width: 15px; height: 15px; border-radius: 3px;
  border: .5px solid rgba(0,0,0,.25); cursor: pointer;
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
}
.chk.done { background: #2e7d32; border-color: #2e7d32; }
.chk.done::after {
  content: ''; width: 7px; height: 4px;
  border-left: 1.5px solid #fff; border-bottom: 1.5px solid #fff;
  transform: rotate(-45deg) translateY(-1px); display: block;
}

/* ── PROGRESS BAR ───────────────────────────────────────────────── */
.pb      { height: 5px; background: rgba(0,0,0,.08); border-radius: 3px; overflow: hidden; }
.pb-fill { height: 100%; border-radius: 3px; transition: width .4s; }

/* ── PROJECT DOT ────────────────────────────────────────────────── */
.proj-dot  { border-radius: 50%; width: 9px; height: 9px; flex-shrink: 0; }
.d-green   { background: #2e7d32; }
.d-blue    { background: #1565c0; }
.d-amber   { background: #f57f17; }
.d-gray    { background: #888;    }

/* ── LIST ITEMS ─────────────────────────────────────────────────── */
.li           { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: .5px solid rgba(0,0,0,.06); }
.li:last-child{ border-bottom: none; }

/* ── MODAL ──────────────────────────────────────────────────────── */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.35);
  z-index: 100; display: flex; align-items: center;
  justify-content: center; padding: 1rem;
}
.modal {
  background: var(--white); border-radius: 14px;
  padding: 1.5rem; width: 640px; max-width: 96vw;
  max-height: 92vh; overflow-y: auto;
  box-shadow: 0 12px 48px rgba(0,0,0,.2);
}
.modal-title  { font-size: 15px; font-weight: 700; margin-bottom: 1.25rem; }
.modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 1.25rem; padding-top: 1rem; border-top: .5px solid var(--border); }

/* ── FORM ───────────────────────────────────────────────────────── */
.fg { margin-bottom: .875rem; }
.fl { font-size: 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; display: block; }
.fi {
  width: 100%; font-size: 13px; padding: 8px 10px;
  border: .5px solid rgba(0,0,0,.2); border-radius: var(--radius);
  font-family: inherit; color: var(--text); background: var(--white);
  outline: none; transition: border-color .15s;
}
.fi:focus { border-color: var(--purple); }
textarea.fi { resize: vertical; min-height: 68px; }
select.fi   { cursor: pointer; }
.pw-wrap    { position: relative; }
.pw-eye     { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #aaa; font-size: 14px; user-select: none; opacity: .4; }

/* ── TOGGLE SWITCH ──────────────────────────────────────────────── */
.toggle     { width: 32px; height: 18px; border-radius: 9px; background: #ddd; position: relative; cursor: pointer; flex-shrink: 0; transition: background .15s; }
.toggle.on  { background: var(--purple); }
.toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.toggle.on::after { left: 16px; }

/* ── ALERTS ─────────────────────────────────────────────────────── */
.alert-card { border-radius: 9px; padding: 10px 14px; margin-bottom: 8px; display: flex; gap: 10px; border: .5px solid; }
.al-red     { background: #fef0f0; border-color: #fcc; }
.al-amber   { background: #fff8e1; border-color: #ffe082; }
.al-purple  { background: #f3e8ff; border-color: #d1b3ff; }

/* ── LEAD PIPELINE ──────────────────────────────────────────────── */
.lead-card    { background: var(--white); border: .5px solid var(--border); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
.lead-hd      { padding: 12px 14px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
.lead-hd:hover{ background: #fafaf9; }
.lead-body    { padding: 14px; border-top: .5px solid var(--border); }
.lead-pipe    { display: flex; overflow-x: auto; margin-bottom: 1rem; }
.lead-stage   { flex: 1; min-width: 80px; text-align: center; padding: 7px 4px; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; border-bottom: 2px solid rgba(0,0,0,.08); color: #aaa; cursor: pointer; white-space: nowrap; }
.lead-stage.cur  { border-bottom-color: var(--purple); color: var(--purple); }
.lead-stage.past { border-bottom-color: #2e7d32; color: #2e7d32; }

/* ── QUOTATION ROW ──────────────────────────────────────────────── */
.qrow    { display: grid; grid-template-columns: 2fr 110px 70px 80px 90px 28px; gap: 6px; margin-bottom: 6px; align-items: center; }
.qrow-hd { display: grid; grid-template-columns: 2fr 110px 70px 80px 90px 28px; gap: 6px; margin-bottom: 5px; }
.qrow-hd span { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }

/* ── SERVICES TABLE ─────────────────────────────────────────────── */
.cat-hd {
  padding: 8px 12px; font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .06em;
  color: var(--purple); background: #f8f4ff;
  border-bottom: .5px solid rgba(0,0,0,.06);
  display: flex; align-items: center; justify-content: space-between;
}

/* ── CALENDAR ───────────────────────────────────────────────────── */
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; }
.cal-lbl  { font-size: 10px; font-weight: 600; color: var(--muted); text-align: center; padding: 4px 0; text-transform: uppercase; }
.cal-cell { min-height: 78px; border-radius: 7px; padding: 5px 6px; background: #f4f3f0; cursor: pointer; }
.cal-cell:hover  { background: #e8e7e0; }
.cal-cell.other  { opacity: .3; }
.cal-cell.today  { background: var(--white); border: 1.5px solid var(--text); }
.cal-date{ font-size: 11px; color: var(--muted); margin-bottom: 3px; }
.cal-ev  { font-size: 9px; padding: 2px 5px; border-radius: 3px; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev-t    { background: #e3f2fd; color: #1565c0; }
.ev-p    { background: #e8f5e9; color: #2e7d32; }
.ev-i    { background: #fff8e1; color: #f57f17; }
.ev-l    { background: #f3e8ff; color: #6d28d9; }
.ev-c    { background: #ede7f6; color: #4527a0; cursor: pointer; }
.ev-o    { background: #fef0f0; color: #c0392b; }

/* ── TOAST ──────────────────────────────────────────────────────── */
.toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--text); color: #fff; font-size: 12px; padding: 9px 16px; border-radius: var(--radius); z-index: 999; opacity: 0; transition: opacity .25s; pointer-events: none; }
.toast.show { opacity: 1; }

/* ── LOGIN ──────────────────────────────────────────────────────── */
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); }
.login-box  { background: var(--white); border-radius: 16px; border: .5px solid var(--border); padding: 2.5rem 2rem; width: 400px; max-width: 94vw; box-shadow: 0 4px 24px rgba(0,0,0,.07); }

/* ── MEMBER PORTAL ──────────────────────────────────────────────── */
.m-task { background: var(--white); border: .5px solid var(--border); border-radius: 10px; padding: .875rem; margin-bottom: 8px; }

/* ── PRINT ──────────────────────────────────────────────────────── */
@media print {
  .sb, .topbar, .topbar-actions, .no-print { display: none !important; }
  .main, .page { padding: 0; overflow: visible; }
  body { background: var(--white); }
}

</style>

// ── PROJECT PROGRESS ────────────────────────────────────────────
function recalcProject(pid) {
  const p = S.projects.find(p => p.id === pid); if(!p) return;
  const all = S.tasks.filter(t => t.projectId === pid);
  p.progress = all.length ? Math.round(all.filter(t=>t.done).length / all.length * 100) : 0;
  if (p.progress === 100) p.status = 'completed';
  else if (p.status === 'completed') p.status = 'active';
}

// ── ALERTS ──────────────────────────────────────────────────────
function getAlerts() {
  const uid = S.currentUser;
  const a = [];
  S.tasks
    .filter(t => !t.done && (isAdmin() || t.assignee === uid))
    .forEach(t => {
      const d = daysLeft(t.dueDate);
      if (d < 0) a.push({type:'over', kind:'Task',    name:t.title, detail:`${Math.abs(d)}d overdue`, d});
      else if(d<=3) a.push({type:'soon', kind:'Task', name:t.title, detail:d===0?'Due today':`Due in ${d}d`, d});
    });
  S.projects
    .filter(p => p.status==='active' && p.progress<100 && (isAdmin()||(p.team||[]).includes(uid)))
    .forEach(p => {
      const d = daysLeft(p.dueDate);
      if (d < 0) a.push({type:'over', kind:'Project',    name:p.name, detail:`${Math.abs(d)}d overdue`, d});
      else if(d<=7) a.push({type:'soon', kind:'Project', name:p.name, detail:d===0?'Due today':`Due in ${d}d`, d});
    });
  if (isAdmin()) {
    S.invoices
      .filter(i => i.status!=='paid' && i.status!=='draft')
      .forEach(i => {
        const d = daysLeft(i.dueDate);
        if (d < 0) a.push({type:'over', kind:'Invoice',    name:i.id, detail:`${fmtINR(i.amount)} · ${Math.abs(d)}d overdue`, d});
        else if(d<=5) a.push({type:'soon', kind:'Invoice', name:i.id, detail:`${fmtINR(i.amount)} · ${d===0?'Due today':'Due in '+d+'d'}`, d});
      });
  }
  return a.sort((a,b) => a.d - b.d);
}

function getFollowups() {
  if (!isAdmin()) return [];
  const now = new Date();
  return S.leads
    .filter(l => {
      if (!l.followupAt || l.followupDone || ['Onboarded','Lost','Rejected'].includes(l.stage)) return false;
      const diff = Math.round((new Date(l.followupAt) - now) / 60000);
      return diff >= -30 && diff <= 1440;
    })
    .sort((a,b) => new Date(a.followupAt) - new Date(b.followupAt));
}

// ── CRYPTO ──────────────────────────────────────────────────────
async function hashPwd(pwd) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pwd));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function checkPwd(input, stored) {
  return !!stored && await hashPwd(input) === stored;
}

async function doSetup() {
  const name  = document.getElementById('su-name').value.trim();
  const email = document.getElementById('su-email').value.trim().toLowerCase();
  const p1    = document.getElementById('su-p1').value;
  const p2    = document.getElementById('su-p2').value;
  const err   = document.getElementById('su-err');
  if (!email || !p1)  { err.textContent = 'Email and password required.';    err.style.display = 'block'; return; }
  if (p1.length < 6)  { err.textContent = 'Password must be 6+ characters.'; err.style.display = 'block'; return; }
  if (p1 !== p2)      { err.textContent = 'Passwords do not match.';          err.style.display = 'block'; return; }
  if (name) { S.ownerName = name; S.ownerInitials = mkInit(name); }
  S.adminEmail    = email;
  S.adminPwdHash  = await hashPwd(p1);
  rebuildMaps(); save();
  S.currentUser = 'OWNER'; S.page = 'dashboard'; render();
}

async function doLogin() {
  const email = document.getElementById('li-email').value.trim().toLowerCase();
  const pass  = document.getElementById('li-pass').value;
  const err   = document.getElementById('li-err');
  const btn   = document.getElementById('li-btn');
  err.style.display = 'none';
  if (!email || !pass) { err.textContent = 'Enter email and password.'; err.style.display = 'block'; return; }
  btn.textContent = 'Signing in…'; btn.disabled = true;
  // Check admin
  if (email === S.adminEmail.toLowerCase() && await checkPwd(pass, S.adminPwdHash)) {
    S.currentUser = 'OWNER'; S.page = 'dashboard'; render(); return;
  }
  // Check team members
  const m = S.team.find(m => (m.email||'').toLowerCase() === email);
  if (m && m.pwdHash && await checkPwd(pass, m.pwdHash)) {
    S.currentUser = m.id; S.page = 'dashboard'; render(); return;
  }
  err.textContent = 'Incorrect email or password.'; err.style.display = 'block';
  btn.textContent = 'Sign In'; btn.disabled = false;
}

function pgCalendar(c, a) {
  a.innerHTML = `
    <button class="btn" onclick="calPrev()">← Prev</button>
    <button class="btn" onclick="calNext()">Next →</button>
    <button class="btn btn-primary" onclick="openAddCalEvent()">+ Event</button>`;

  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DAYS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const y = S.calYear, m = S.calMonth;
  const fd  = new Date(y, m, 1).getDay();
  const dim = new Date(y, m+1, 0).getDate();
  const dip = new Date(y, m, 0).getDate();

  // Build event map: date-key → [{label, cls, id?}]
  const evMap = {};
  function addEv(dt, ev) {
    const d = new Date(dt);
    const k = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    if (!evMap[k]) evMap[k] = [];
    evMap[k].push(ev);
  }
  S.tasks.filter(t=>!t.done).forEach(t => addEv(t.dueDate, {label:`[T] ${t.title.slice(0,14)}`, cls: daysLeft(t.dueDate)<0?'ev-o':'ev-t'}));
  S.projects.filter(p=>p.status==='active').forEach(p => addEv(p.dueDate, {label:`[P] ${p.name.slice(0,14)}`, cls: daysLeft(p.dueDate)<0?'ev-o':'ev-p'}));
  S.invoices.filter(i=>i.status!=='paid'&&i.status!=='draft').forEach(i => addEv(i.dueDate, {label:`[I] ${i.id}`, cls:'ev-i'}));
  if (isAdmin()) S.leads.filter(l=>l.followupAt&&!l.followupDone).forEach(l => addEv(new Date(l.followupAt), {label:`[F] ${l.title.slice(0,13)}`, cls:'ev-l'}));
  S.calEvents.forEach(e => addEv(e.date, {label: e.title, cls:'ev-c', id: e.id}));

  let cells = '', dc = 1;
  for (let i = 0; i < 42; i++) {
    let cd, ot = false;
    if (i < fd)   { cd = new Date(y, m-1, dip-fd+1+i); ot = true; }
    else if (dc <= dim) { cd = new Date(y, m, dc++); }
    else          { cd = new Date(y, m+1, dc++-dim); ot = true; }
    const isT = cd.toDateString() === TODAY.toDateString();
    const k   = `${cd.getFullYear()}-${cd.getMonth()}-${cd.getDate()}`;
    const evs = evMap[k] || [];
    const iso = cd.toISOString().split('T')[0];
    const dateNum = isT
      ? `<span style="background:#1a1a1a;color:#fff;border-radius:50%;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-size:10px">${cd.getDate()}</span>`
      : cd.getDate();
    cells += `<div class="cal-cell ${ot?'other':''} ${isT?'today':''}" onclick="openAddCalEvent('${iso}')">
      <div class="cal-date">${dateNum}</div>
      ${evs.slice(0,3).map(ev=>`<div class="cal-ev ${ev.cls}" ${ev.id?`onclick="event.stopPropagation();delCalEv('${ev.id}')" title="Click to delete"`:''} >${esc(ev.label)}</div>`).join('')}
      ${evs.length>3 ? `<div style="font-size:9px;color:#aaa;padding:1px 5px">+${evs.length-3} more</div>` : ''}
    </div>`;
  }

  c.innerHTML = `<div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px">
      <span style="font-size:14px;font-weight:600">${MONTHS[m]} ${y}</span>
      <div style="display:flex;gap:10px;font-size:11px;flex-wrap:wrap">
        ${[['ev-t','Tasks'],['ev-p','Projects'],['ev-i','Invoices'],['ev-l','Follow-ups'],['ev-c','Custom Events'],['ev-o','Overdue']].map(([cls,lbl])=>`<span style="display:flex;align-items:center;gap:3px"><span class="cal-ev ${cls}" style="width:10px;height:10px;display:inline-block;border-radius:2px;padding:0"></span>${lbl}</span>`).join('')}
      </div>
    </div>
    <div class="cal-grid">
      ${DAYS.map(d=>`<div class="cal-lbl">${d}</div>`).join('')}
      ${cells}
    </div>
    <div style="font-size:10px;color:#888;text-align:center;margin-top:.75rem">Click any date to add an event · Click a teal event to delete it</div>
  </div>`;
}

function calPrev() { S.calMonth--; if (S.calMonth < 0) { S.calMonth=11; S.calYear--; } renderPage(); }
function calNext() { S.calMonth++; if (S.calMonth > 11) { S.calMonth=0;  S.calYear++; } renderPage(); }

function openAddCalEvent(pre) {
  showModal(`<div class="modal-title">Add Calendar Event</div>
    <div class="fg"><label class="fl">Title *</label><input class="fi" id="ev-t" placeholder="e.g. Client call"></div>
    <div class="fg"><label class="fl">Date</label><input class="fi" id="ev-d" type="date" value="${pre||''}"></div>
    <div class="fg"><label class="fl">Note</label><input class="fi" id="ev-n" placeholder="Details..."></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveCalEv()">Add Event</button>
    </div>`);
}

function saveCalEv() {
  const t = document.getElementById('ev-t').value.trim();
  const d = document.getElementById('ev-d').value;
  if (!t || !d) { alert('Title and date required.'); return; }
  S.calEvents.push({ id:uid(), title:t, date:new Date(d), note:document.getElementById('ev-n').value.trim() });
  save(); closeModal(); renderPage();
}

function delCalEv(id) {
  const i = S.calEvents.findIndex(e=>e.id===id);
  if (i > -1) { S.calEvents.splice(i,1); save(); renderPage(); }
}

function saveProject() {
  const name = document.getElementById('pj-name').value.trim();
  if (!name) { alert('Project name required.'); return; }
  const t1 = document.getElementById('t1-title').value.trim();
  if (!t1) { alert('At least one task is required.'); document.getElementById('t1-title').focus(); return; }
  const clientId = document.getElementById('pj-client').value;
  const cl = S.clients.find(c=>c.id===clientId);
  const due = document.getElementById('pj-due').value;
  const pid = uid();
  const dotC = dotClass(S.projects.length);
  const proj = {
    id:pid, name, client:cl.name, clientId, status:document.getElementById('pj-status').value,
    progress:0, dotClass:dotC, team:['OWNER'],
    dueDate: due ? new Date(due) : new Date(TODAY.getTime()+30*86400000)
  };
  S.projects.push(proj);
  if (cl) cl.projects = (cl.projects||0) + 1;

  // Save first task
  const t1due = document.getElementById('t1-due').value;
  const t1assign = document.getElementById('t1-assign').value;
  S.tasks.push({
    id:uid(), title:t1, project:name, projectId:pid, assignee:t1assign,
    priority:document.getElementById('t1-pri').value,
    notes:document.getElementById('t1-notes').value.trim(),
    done:false,
    dueDate: t1due ? new Date(t1due) : new Date(TODAY.getTime()+7*86400000)
  });
  if (!proj.team.includes(t1assign)) proj.team.push(t1assign);

  // Extra tasks
  (window._extraTasks||[]).forEach(i => {
    const titleEl = document.getElementById(`et${i}-t`);
    if (!titleEl) return;
    const tt = titleEl.value.trim(); if (!tt) return;
    const tdue = document.getElementById(`et${i}-d`)?.value;
    const tassign = document.getElementById(`et${i}-a`)?.value || 'OWNER';
    S.tasks.push({
      id:uid(), title:tt, project:name, projectId:pid, assignee:tassign,
      priority:document.getElementById(`et${i}-p`)?.value||'medium',
      notes:'', done:false,
      dueDate: tdue ? new Date(tdue) : new Date(TODAY.getTime()+7*86400000)
    });
    if (!proj.team.includes(tassign)) proj.team.push(tassign);
  });
  window._extraTasks = [];
  recalcProject(pid); save();
  logAct('project', `Project <b>${esc(name)}</b> created`, '📁');
  toast(`"${name}" created`); closeModal(); renderPage();
}

function openAddTaskForProject(pid) {
  const p = S.projects.find(p=>p.id===pid); if(!p) return;
  const to = S.team.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('');
  showModal(`<div class="modal-title">Add Task — ${esc(p.name)}</div>
    <div class="fg"><label class="fl">Task Title *</label><input class="fi" id="ta-title" placeholder="e.g. Design story set"></div>
    <div class="g2">
      <div class="fg"><label class="fl">Assign To</label><select class="fi" id="ta-assign"><option value="OWNER">${esc(S.ownerName)} (You)</option>${to}</select></div>
      <div class="fg"><label class="fl">Due Date</label><input class="fi" id="ta-due" type="date"></div>
    </div>
    <div class="fg"><label class="fl">Priority</label><select class="fi" id="ta-pri"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select></div>
    <div class="fg"><label class="fl">Notes</label><textarea class="fi" id="ta-notes" placeholder="Task details..."></textarea></div>
    <input type="hidden" id="ta-proj" value="${pid}">
    <div class="modal-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveTask()">Add Task</button></div>`);

function deleteProject(pid) {
  const p = S.projects.find(p=>p.id===pid); if(!p) return;
  const taskCount = S.tasks.filter(t=>t.projectId===pid).length;
  if (!confirm(`Delete "${p.name}"?\n\n${taskCount} task${taskCount!==1?'s':''} will also be deleted.`)) return;
  S.projects.splice(S.projects.findIndex(p=>p.id===pid), 1);
  S.tasks = S.tasks.filter(t=>t.projectId!==pid);
  save(); toast(`"${p.name}" deleted`); renderPage();
}

          <div style="font-size:10px;color:#f57f17;background:#fff8e1;border-radius:6px;padding:5px 9px;margin-bottom:.75rem">

function togglePerm(mid, mod) {
  const m = S.team.find(m=>m.id===mid); if(!m) return;
  if (!m.perms) m.perms = {...DEFAULT_PERMS};
  m.perms[mod] = !m.perms[mod];
  save(); toast(`${m.name}: ${MODULES[mod].label} ${m.perms[mod]?'✓ enabled':'disabled'}`); renderPage();
}

function removeMember(id) {
  const m = S.team.find(m=>m.id===id); if(!m) return;
  if (!confirm(`Remove "${m.name}" from the team?\n\nThey will lose login access. Their tasks will remain.`)) return;
  S.team.splice(S.team.findIndex(m=>m.id===id), 1);
  rebuildMaps(); save(); toast(`${m.name} removed`); renderPage();
}

function openAssignTask(mid) {
  const m = S.team.find(m=>m.id===mid); if(!m) return;
  if (!S.projects.length) { alert('Create a project first.'); return; }
  const po = S.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
  showModal(`<div class="modal-title">Assign Task to ${esc(m.name)}</div>
    <div class="fg"><label class="fl">Task Title *</label><input class="fi" id="ta-title" placeholder="e.g. Write homepage copy"></div>
    <div class="g2">
      <div class="fg"><label class="fl">Project</label><select class="fi" id="ta-proj">${po}</select></div>

    </div>
    <div class="fg"><label class="fl">Priority</label><select class="fi" id="ta-pri"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select></div>

}

  const mods = Object.keys(MODULES);
  showModal(`<div class="modal-title">Add Team Member</div>

      <div class="fg"><label class="fl">Full Name *</label><input class="fi" id="mm-name" placeholder="e.g. Anika Sharma"></div>

      <div class="fg"><label class="fl">Password *</label><div class="pw-wrap"><input class="fi" id="mm-p1" type="password" placeholder="Min 6 characters"><span class="pw-eye" onclick="toggleEye('mm-p1',this)">👁</span></div></div>

        <input type="checkbox" id="mp-${k}" ${DEFAULT_PERMS[k]?'checked':''} style="accent-color:#7c3aed;width:14px;height:14px">
        <span style="font-size:11px">${MODULES[k].label}</span>
      </label>`).join('')}
    </div>
    <div class="modal-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveMember()">Add Member</button></div>`);

async function saveMember() {
  const name  = document.getElementById('mm-name').value.trim();  if (!name)  { alert('Name required.'); return; }
  const email = document.getElementById('mm-email').value.trim().toLowerCase(); if (!email) { alert('Email required.'); return; }
  const p1    = document.getElementById('mm-p1').value;
  const p2    = document.getElementById('mm-p2').value;
  if (p1.length < 6)  { alert('Password must be at least 6 characters.'); return; }
  if (p1 !== p2)      { alert('Passwords do not match.'); return; }
  if (S.team.find(m=>(m.email||'').toLowerCase()===email) || email===S.adminEmail.toLowerCase()) {
    alert('This email is already in use.'); return;
  }
  const rawId = document.getElementById('mm-id').value.trim().toUpperCase() || mkInit(name);
  const mid   = rawId.slice(0,3);
  if (S.team.find(m=>m.id===mid)) { alert(`Initials "${mid}" already in use. Choose different initials.`); return; }
  const perms = {};
  Object.keys(MODULES).forEach(k => { perms[k] = document.getElementById(`mp-${k}`)?.checked || false; });
  S.team.push({
    id:mid, name, email, role:document.getElementById('mm-role').value.trim()||'Team Member',
    avClass:avClass(S.team.length), perms, pwdHash:await hashPwd(p1)
  });
  rebuildMaps(); save();
  logAct('client', `Team member <b>${esc(name)}</b> added`, '👤');
  toast(`${name} added ✓`); closeModal(); renderPage();
}

function openEditMember(id) {
  const m = S.team.find(m=>m.id===id); if(!m) return;
  showModal(`<div class="modal-title">Edit — ${esc(m.name)}</div>
    <div class="fg"><label class="fl">Full Name *</label><input class="fi" id="em-name" value="${esc(m.name)}"></div>
    <div class="fg"><label class="fl">Role</label><input class="fi" id="em-role" value="${esc(m.role||'')}"></div>
    <div class="fg"><label class="fl">Email</label><input class="fi" id="em-email" type="email" value="${esc(m.email||'')}"></div>
    <div style="border-top:.5px solid #eee;padding-top:.875rem;margin:.875rem 0">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:#888;margin-bottom:8px">Reset Password (leave blank to keep current)</div>
      <div class="g2">
        <div class="fg"><label class="fl">New Password</label><div class="pw-wrap"><input class="fi" id="em-p1" type="password" placeholder="Min 6 chars"><span class="pw-eye" onclick="toggleEye('em-p1',this)">👁</span></div></div>
        <div class="fg"><label class="fl">Confirm</label><input class="fi" id="em-p2" type="password"></div>
      </div>
    </div>
    <div class="modal-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="updateMember('${id}')">Save</button></div>`);
}

async function updateMember(id) {
  const m = S.team.find(m=>m.id===id); if(!m) return;
  m.name = document.getElementById('em-name').value.trim() || m.name;
  m.role = document.getElementById('em-role').value.trim() || m.role;
  const ne = document.getElementById('em-email').value.trim().toLowerCase();
  if (ne && ne !== (m.email||'').toLowerCase()) {
    if (S.team.find(t=>t.id!==id&&(t.email||'').toLowerCase()===ne)||ne===S.adminEmail.toLowerCase()) {
      alert('Email already in use.'); return;
    }
    m.email = ne;
  }
  const p1 = document.getElementById('em-p1').value;
  if (p1) {
    if (p1.length < 6)                                 { alert('Min 6 chars.'); return; }
    if (p1 !== document.getElementById('em-p2').value) { alert('Passwords do not match.'); return; }
    m.pwdHash = await hashPwd(p1);
  }
  rebuildMaps(); save(); toast(`${m.name} updated ✓`); closeModal(); renderPage();
}

    return `<div style="text-align:center;padding:10px 8px;background:#fff;border-radius:8px;border:.5px solid #eee;min-width:75px">
      <div style="font-size:18px;font-weight:700;color:${STAGE_COLOR[st]}">${cnt}</div>
      <div style="font-size:10px;color:#888;margin-top:2px">${st}</div>

    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:1.5rem">${pipeHTML}</div>

    <div class="lead-hd" onclick="toggleLeadExpand('${l.id}')">

    ${ex ? `<div class="lead-body">
      <!-- Stage pipeline -->

        ${LEAD_STAGES.map(st=>{const idx=LEAD_STAGES.indexOf(st),ci=LEAD_STAGES.indexOf(l.stage);return `<div class="lead-stage ${st===l.stage?'cur':idx<ci?'past':''}" onclick="setLeadStage('${l.id}','${st}')">${st}</div>`;}).join('')}
      </div>
      <!-- Details grid -->
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:1rem">

          <div style="font-size:10px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px">${k}</div>

          <div style="font-size:10px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px">Services Interested In</div>
          <div style="display:flex;flex-wrap:wrap;gap:5px">${l.services.map(s=>`<span class="badge b-purple">${esc(s)}</span>`).join('')}</div>
        </div>` : ''}
        ${l.notes ? `<div style="grid-column:1/-1">
          <div style="font-size:10px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px">Notes</div>
          <div style="font-size:12px;background:#f4f3f0;border-radius:6px;padding:8px 10px">${esc(l.notes)}</div>
        </div>` : ''}
        ${l.lostReason ? `<div style="grid-column:1/-1">
          <div style="font-size:10px;color:#c0392b;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px">Lost / Rejected Reason</div>
          <div style="font-size:12px;color:#c0392b">${esc(l.lostReason)}</div>
        </div>` : ''}
      </div>
      <!-- Quotations -->
      <div style="background:#f8f7f5;border-radius:8px;padding:12px;margin-bottom:1rem">
        <div style="font-size:11px;font-weight:700;margin-bottom:8px">Quotations (${quotes.length})</div>
        ${quotes.map(q=>`<div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:.5px solid rgba(0,0,0,.06)">
          <span style="font-size:12px;font-weight:600;min-width:65px">${esc(q.quoteNo)}</span>
          <span style="font-size:12px;flex:1">${(q.items||[]).length} items</span>

            <div style="font-size:10px;color:#888;margin-bottom:3px">Date & Time</div>

    </div>` : ''}
  </div>`;
}

function toggleLeadExpand(id) {
  S.expandedLeads[id] = !S.expandedLeads[id];
  const ll = document.getElementById('lead-list');
  if (ll) ll.innerHTML = S.leads.map(l=>leadCard(l)).join('');
}

function setLeadStage(id, stage) {
  const l = S.leads.find(l=>l.id===id); if(!l) return;
  l.stage = stage; save();
  logAct('lead', `Lead "<b>${esc(l.title)}</b>" → <b>${stage}</b>`, '→');
  const ll = document.getElementById('lead-list');
  if (ll) ll.innerHTML = S.leads.map(l=>leadCard(l)).join('');
  // refresh pipeline counts
  pgLeads(document.getElementById('pg-content'), document.getElementById('pg-actions'));
}

function deleteLead(id) {
  const l = S.leads.find(l=>l.id===id);
  if (!l || !confirm(`Delete lead "${l.title}"?`)) return;
  S.leads.splice(S.leads.findIndex(l=>l.id===id), 1);
  save(); renderPage();
}

function updateLead(id) {
  const l = S.leads.find(l=>l.id===id); if(!l) return;
  l.title   = document.getElementById('l-title').value.trim()   || l.title;
  l.company = document.getElementById('l-co').value.trim();
  l.contact = document.getElementById('l-contact').value.trim();
  l.phone   = document.getElementById('l-phone').value.trim();
  l.email   = document.getElementById('l-email').value.trim();
  l.value   = Number(document.getElementById('l-value').value)||0;
  l.stage   = document.getElementById('l-stage').value;
  l.notes   = document.getElementById('l-notes').value.trim();

function saveFollowup(id) {

function qRow(i, svcName, rate, disc, qty) {
  const svcs = allServices();
  const opts = svcs.map(s=>`<option value="${esc(s.name)}" data-price="${s.price}" ${s.name===svcName?'selected':''}>${esc(s.name)} (${fmtINR(s.price)})</option>`).join('');
  return `<div class="qrow" id="qrow-${i}">
    <select class="fi" id="qs-${i}" onchange="onQSvcChange(${i})" style="font-size:11px">
      <option value="">— Select service —</option>${opts}
    </select>
    <input class="fi" id="qr-${i}" type="number" placeholder="Rate ₹" value="${rate||''}" oninput="calcQTotal()" style="font-size:12px">
    <input class="fi" id="qq-${i}" type="number" placeholder="Qty" value="${qty||1}" min="1" oninput="calcQTotal()" style="font-size:12px">
    <input class="fi" id="qd-${i}" type="number" placeholder="0%" value="${disc||0}" min="0" max="100" oninput="calcQTotal()" style="font-size:12px;${disc>0?'background:#fffde7':''}">
    <input class="fi" id="qn-${i}" type="number" readonly style="font-size:12px;background:#f4f3f0">
    <button class="btn btn-danger btn-sm" onclick="document.getElementById('qrow-${i}').remove();calcQTotal()" style="padding:4px 7px">✕</button>
  </div>`;
}

function addQRow() {
  const c = document.getElementById('q-rows'); if(!c) return;
  const d = document.createElement('div');
  d.innerHTML = qRow(_qri, '', 0, 0, 1);
  c.appendChild(d.firstElementChild);
  _qri++; calcQTotal();
}

function onQSvcChange(i) {
  const sel = document.getElementById(`qs-${i}`); if(!sel) return;
  const opt = sel.options[sel.selectedIndex];
  const price = opt ? opt.getAttribute('data-price') : 0;
  const r = document.getElementById(`qr-${i}`); if(r) r.value = price || '';
  calcQTotal();
}

function calcQTotal() {
  let sub = 0, discTotal = 0;
  for (let i = 0; i <= _qri + 5; i++) {
    const r = document.getElementById(`qr-${i}`);
    const q = document.getElementById(`qq-${i}`);
    const d = document.getElementById(`qd-${i}`);
    const n = document.getElementById(`qn-${i}`);
    if (!r) continue;
    const rate = Number(r.value)||0;
    const qty  = Number(q?.value)||1;
    const dp   = Number(d?.value)||0;
    const gross= rate * qty;
    const da   = Math.round(gross * dp / 100);
    const net  = gross - da;
    if (n) n.value = Math.round(net) || '';
    if (d) d.style.background = dp > 0 ? '#fffde7' : '';
    sub      += gross;
    discTotal+= da;
  }
  const net    = sub - discTotal;
  const gstPct = Number(document.getElementById('q-gst')?.value)||0;
  const gstAmt = Math.round(net * gstPct / 100);
  const total  = Math.round(net + gstAmt);
  const tb = document.getElementById('q-total');
  if (tb) tb.innerHTML = `
    <span style="margin-right:12px">Subtotal: <b>${fmtINR(Math.round(sub))}</b></span>
    ${discTotal>0?`<span style="margin-right:12px;color:#2e7d32">Discount: <b>−${fmtINR(Math.round(discTotal))}</b></span>`:''}
    <span style="margin-right:12px">GST (${gstPct}%): <b>${fmtINR(gstAmt)}</b></span>
    <b style="font-size:15px">Grand Total: ${fmtINR(total)}</b>`;
}

function qPrefillLead() {
  const sel = document.getElementById('q-lead'); if(!sel) return;
  const l = S.leads.find(l=>l.id===sel.value); if(!l) return;
  const set = (id, val) => { const el=document.getElementById(id); if(el) el.value=val; };
  set('q-client', l.company||l.title);
  set('q-contact', l.contact||'');
  set('q-email', l.email||'');
  set('q-phone', l.phone||'');
}

function getQItems() {
  const items = [];
  for (let i = 0; i <= _qri + 5; i++) {
    const sv = document.getElementById(`qs-${i}`);
    const ra = document.getElementById(`qr-${i}`);
    const qq = document.getElementById(`qq-${i}`);
    const dc = document.getElementById(`qd-${i}`);
    if (!ra) continue;
    const svc = sv?.value, rate = Number(ra.value)||0;
    if (!svc && !rate) continue;
    const qty   = Number(qq?.value)||1;
    const dp    = Number(dc?.value)||0;
    const gross = rate * qty;
    const da    = Math.round(gross * dp / 100);
    const net   = Math.round(gross - da);
    items.push({ service:svc||'Custom', rate, qty, discPct:dp, discAmt:da, gross:Math.round(gross), net });
  }
  return items;
}

function saveQuote() {
  const client = document.getElementById('q-client')?.value.trim();
  if (!client) { alert('Client name required.'); return; }
  const items = getQItems();
  if (!items.length) { alert('Add at least one service line item.'); return; }

  const leadId = document.getElementById('q-lead')?.value || '';
  const lead   = S.leads.find(l=>l.id===leadId);
  const sub    = items.reduce((s,i)=>s+i.gross, 0);
  const totDisc= items.reduce((s,i)=>s+i.discAmt, 0);
  const net    = sub - totDisc;
  const gstPct = Number(document.getElementById('q-gst')?.value)||0;
  const gstAmt = Math.round(net * gstPct / 100);
  const total  = Math.round(net + gstAmt);
  const qNo    = 'QT-' + String(S.quotations.length + 1).padStart(3,'0');

  const q = {
    id:uid(), quoteNo:qNo, leadId, leadTitle:lead?lead.title:'',
    clientName:client,
    contactName: document.getElementById('q-contact')?.value.trim()||'',
    email:       document.getElementById('q-email')?.value.trim()||'',
    phone:       document.getElementById('q-phone')?.value.trim()||'',
    validUntil:  document.getElementById('q-valid')?.value||'',
    terms:       document.getElementById('q-terms')?.value.trim()||'',
    scope:       document.getElementById('q-scope')?.value.trim()||'',
    addNotes:    document.getElementById('q-notes')?.value.trim()||'',
    items, subtotal:sub, totalDiscount:totDisc, netTotal:net,
    gstPct, gstAmt, total,
    status:'draft', createdAt:new Date().toISOString()
  };

  S.quotations.push(q);
  if (lead) {
    if (!lead.quotations) lead.quotations = [];
    lead.quotations.push(q.id);
    if (total > 0 && !lead.value) lead.value = total;
  }

  save();
  logAct('lead', `Quotation <b>${qNo}</b> created for <b>${esc(client)}</b>`, '📄');
  toast(`${qNo} saved ✓`);
  closeModal();
  S.page = 'quotations';
  renderPage();
}

function updateQStatus(id, status) {
  const q = S.quotations.find(q=>q.id===id); if(!q) return;
  q.status = status; save(); renderPage();
}

function openViewQuote(id) {
  const q = S.quotations.find(q=>q.id===id); if(!q) return;

    <div style="font-family:-apple-system,sans-serif">${quoteHTML(q)}</div>
    <div class="modal-footer no-print">
      <button class="btn" onclick="closeModal()">Close</button>
      <button class="btn btn-primary" onclick="printQuote('${q.id}')">Download / Print PDF</button>
    </div>`);
}

function printQuote(id) {
  const q = S.quotations.find(q=>q.id===id); if(!q) return;
  const w = window.open('', '_blank');
  const body = quoteHTML(q);
  // Build print page — avoid script tags inside template literal
  const printPage = [
    '<!DOCTYPE html><html><head>',
    '<meta charset="UTF-8">',
    '<title>' + esc(q.quoteNo) + ' — ' + esc(q.clientName) + '</title>',
    '<style>',
    '*{box-sizing:border-box;margin:0;padding:0}',
    'body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:2.5rem;color:#1a1a1a;max-width:820px;margin:0 auto}',
    '@media print{@page{margin:1.5cm}}',
    '</style>',
    '</head><body>',
    body,
    '</body></html>'
  ].join('');
  w.document.write(printPage);
  w.document.close();
  setTimeout(() => w.print(), 400);
}

function saveEditService(code) {
  const name  = document.getElementById('sv-name').value.trim();
  const cat   = document.getElementById('sv-cat').value.trim();
  const price = Number(document.getElementById('sv-price').value)||0;
  if (!name || !cat || !price) { alert('Name, category and rate are required.'); return; }
  if (!S.customServices) S.customServices = [];
  // Remove existing custom entry for this code (if any), then push updated
  S.customServices = S.customServices.filter(s=>s.code!==code);
  S.customServices.push({
    name, code, cat,
    desc:  document.getElementById('sv-desc').value.trim(),
    unit:  document.getElementById('sv-unit').value,
    price, gst: Number(document.getElementById('sv-gst').value)||18,
    hsn:   document.getElementById('sv-hsn').value.trim()||'998361'
  });
  save();
  logAct('client', `Service <b>${esc(name)}</b> updated`, '✎');
  toast(`"${name}" updated ✓`); closeModal(); renderPage();
}

function deleteService(code) {
  const s = allServices().find(s=>s.code===code); if(!s) return;
  if (!confirm(`Delete "${s.name}"?\n\nThis cannot be undone.`)) return;
  S.customServices = (S.customServices||[]).filter(cs=>cs.code!==code);
  save(); toast(`"${s.name}" deleted`); renderPage();
}

function openAddInvoice(clientId) {
  if (!S.clients.length) { alert('Add a client first.'); return; }

    <div class="fg"><label class="fl">Client</label><select class="fi" id="inv-client">${co}</select></div>

function saveInvoice() {
  const cid    = document.getElementById('inv-client').value;
  const amount = Number(document.getElementById('inv-amt').value)||0;
  if (!amount) { alert('Amount required.'); return; }
  const due    = document.getElementById('inv-due').value;
  const status = document.getElementById('inv-status').value;
  const cl     = S.clients.find(c=>c.id===cid);
  const invId  = 'INV-' + String(S.invoices.length+1).padStart(3,'0');
  S.invoices.push({
    id:invId, client:cl.name, clientId:cid, amount, status,
    dueDate: due ? new Date(due) : new Date(TODAY.getTime()+30*86400000),
    issued:  new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})
  });
  save(); logAct('invoice', `Invoice <b>${invId}</b> for <b>${esc(cl.name)}</b> — ${fmtINR(amount)}`, '₹');
  toast(`${invId} created ✓`); closeModal(); S.page='invoices'; renderPage();
}

function markPaid(id) {
  const i = S.invoices.find(i=>i.id===id); if(!i) return;
  i.status = 'paid'; save();
  logAct('invoice', `Invoice <b>${id}</b> marked paid`, '₹');
  toast(`${id} marked paid ✓`); renderPage();
}

function mNav(pg) {
  const m = curMember(); if(!m) return;
  if (!memberPerms(m)[pg]) { toast('You do not have access to this module.'); return; }

  document.querySelectorAll('.sb-item').forEach(el=>el.classList.toggle('on', el.getAttribute('onclick')===`mNav('${pg}')`));
  const t = document.getElementById('m-title'); if(t) t.textContent = MODULES[pg]?.label||pg;
  renderMemberPage();
}

function renderMemberPage() {
  const c = document.getElementById('m-page'); if(!c) return;
  if (S.page === 'services') S.page = 'dashboard'; // Hard block
  switch(S.page) {
    case 'dashboard':   mDashboard(c);       break;
    case 'tasks':       c.innerHTML = mTasksHTML();       break;
    case 'projects':    c.innerHTML = mProjectsHTML();    break;
    case 'clients':     c.innerHTML = mClientsHTML();     break;
    case 'invoices':    c.innerHTML = mInvoicesHTML();    break;
    case 'leads':       c.innerHTML = mLeadsHTML();       break;
    case 'quotations':  c.innerHTML = mQuotationsHTML();  break;
    case 'calendar':    pgCalendar(c, {innerHTML:''});    break;
    case 'alerts':      pgAlerts(c, {innerHTML:''});      break;
    case 'activity':    pgActivity(c, {innerHTML:''});    break;
    default:            mDashboard(c);
  }
}

function mDashboard(c) {
  const m = curMember(); if(!m) return;
  const myT = S.tasks.filter(t=>t.assignee===m.id);
  const myP = S.projects.filter(p=>(p.team||[]).includes(m.id));
  const ov  = myT.filter(t=>!t.done && daysLeft(t.dueDate)<0);

function mToggleTask(id) {
  const t = S.tasks.find(t=>t.id===id);

}

// Save project — member version (assigns self automatically)
function mSaveProject() {
  const m    = curMember(); if(!m) return;
  const name = document.getElementById('pj-name').value.trim();
  if (!name) { alert('Project name required.'); return; }
  const t1   = document.getElementById('t1-title').value.trim();
  if (!t1)   { alert('At least one task is required.'); return; }
  const clientId = document.getElementById('pj-client').value;
  const cl   = S.clients.find(c=>c.id===clientId);
  const due  = document.getElementById('pj-due').value;
  const pid  = uid();
  const dotC = dotClass(S.projects.length);
  S.projects.push({
    id:pid, name, client:cl.name, clientId, status:document.getElementById('pj-status').value,
    progress:0, dotClass:dotC, team:['OWNER', m.id],
    dueDate: due ? new Date(due) : new Date(TODAY.getTime()+30*86400000)
  });
  if (cl) cl.projects = (cl.projects||0) + 1;
  const t1due = document.getElementById('t1-due').value;
  S.tasks.push({
    id:uid(), title:t1, project:name, projectId:pid, assignee:m.id,
    priority:document.getElementById('t1-pri').value,
    notes:document.getElementById('t1-notes').value.trim(),
    done:false,
    dueDate: t1due ? new Date(t1due) : new Date(TODAY.getTime()+7*86400000)
  });
  recalcProject(pid);
  save();
  logAct('project', `Project <b>${esc(name)}</b> created by <b>${esc(m.name)}</b>`, '📁');
  toast(`"${name}" created ✓`);
  closeModal();
  renderMemberPage();
}

  const to = `<option value="${m.id}" selected>${esc(m.name)} (Me)</option><option value="OWNER">${esc(S.ownerName)}</option>` + S.team.filter(t=>t.id!==m.id).map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');
  showModal(`<div class="modal-title">Add Task</div>
    <div class="fg"><label class="fl">Task Title *</label><input class="fi" id="ta-title" placeholder="e.g. Design carousel posts"></div>
    <div class="g2">
      <div class="fg"><label class="fl">Project</label><select class="fi" id="ta-proj">${po}</select></div>
      <div class="fg"><label class="fl">Assign To</label><select class="fi" id="ta-assign">${to}</select></div>
      <div class="fg"><label class="fl">Due Date</label><input class="fi" id="ta-due" type="date"></div>
      <div class="fg"><label class="fl">Priority</label><select class="fi" id="ta-pri"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select></div>
    </div>
    <div class="fg"><label class="fl">Notes</label><textarea class="fi" id="ta-notes" placeholder="Task details..."></textarea></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveTask();renderMemberPage()">Add Task</button>
    </div>`);
}


// BOOT
startFirebase();
</script>
</body>
</html>
